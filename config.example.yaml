    - name: volumebot-pair-5
      project: volumebot
      critical: true
    - name: volumebot-pair-6
      project: volumebot
      critical: true
    - name: volumebot-pair-7
      project: volumebot
      critical: true
    - name: volumebot-db
      project: volumebot
      critical: true
    - name: vault-automater-worker-1
      project: vault-automater
      critical: true
    - name: vault-automater-web-1
      project: vault-automater
      critical: true
    - name: vault-automater-api-1
      project: vault-automater
      critical: true
    - name: ethzigiquid-web-1
      project: ethzigiquid
      critical: true
    - name: ethzigiquid-api-1
