poll_interval_seconds: 5
project_correlation_seconds: 10
summary_interval_seconds: 300
database_path: /data/incidents.db
systemd_status_path: /data/systemd-status.json
allow_container_restart: true

daily_reports:
  frontend:
    enabled: true
    time: "09:00"
    timezone: Asia/Karachi
    items:
      - id: beencointernalcomms
        name: Beenco Internal Comms
        health_url: http://127.0.0.1:4173/health
      - id: beencomindshub
        name: Beencomindshub
        health_url: http://127.0.0.1:3000/health
      - id: liquidity-provider
        name: Liquidity Provider
        health_url: http://127.0.0.1:5173/health
      - id: vault-automator
        name: VaultAutomator
        health_url: http://127.0.0.1:4560/
      - id: ethzigliquid
        name: EthZigLiquid
        health_url: http://127.0.0.1:18300/
      - id: arkive
        name: Arkive
        health_url: http://127.0.0.1:8043/health
      - id: zigexchange
        name: ZigExchange
        health_url: http://127.0.0.1:4090/
  bots:
    enabled: true
    time: "09:05"
    timezone: Asia/Karachi

bot_reports:
  zig_whale:
    container: zig-whale-bot
    log_tail_lines: 500
    stale_after_seconds: 180
    exchanges:
      - MEXC
      - Bybit
      - KuCoin
      - Gate.io
      - Bitget
  zig_usd_alerts:
    container: zig-usd-only-alerts-zig-only-alerts-1
    log_tail_lines: 500
    stale_after_seconds: 300
    marker: "[PROCESSING] TX:"
  wallet_monitor:
    container: wallet-monitor
    log_tail_lines: 500
    stale_after_seconds: 3600
  zigchain_bot:
    container: zigchain-bot
    log_tail_lines: 500
    stale_after_seconds: 300
    markers:
      - "Status collection complete"
      - "PG height fetched"
  stake_unstake:
    container: zigchain-monitor
    log_tail_lines: 500
    stale_after_seconds: 300
    markers:
      - "[processor] catching up blocks"
      - "[status] live at block"
  mdf_tracker:
    container: mdf-tracker
    log_tail_lines: 500
    stale_after_seconds: 3600
    markers:
      - "[TG] Telegram bot started"
      - "[WS] Connected"
      - "[WS] Subscribed to MDF create_denom"
      - "[WS] Subscribed to CreatePairAndProvideLiquidity"
  highbuy_monitor:
    container: highbuy-monitor
    log_tail_lines: 500
    stale_after_seconds: 3600
  nawa_valdora:
    container: zigchain-wallet-monitor
    log_tail_lines: 1000
    stale_after_seconds: 300
    max_block_gap: 20
  tokenx_vault:
    container: bsc-and-eth-token-monitor
    postgres_container: tokenx-vault-postgres
    log_tail_lines: 2000
    stale_after_seconds: 300
    max_backlog_blocks: 500
  bep20_usdt:
    container: bep20-usdt-telegram-monitor
    log_tail_lines: 1000
    stale_after_seconds: 7200
    max_backlog_blocks: 500
  eth_usdt:
    container: eth-usdt-telegram-monitor
    log_tail_lines: 1000
    stale_after_seconds: 7200
    max_backlog_blocks: 500
  sheets_sync:
    container: sheets-sync
    log_tail_lines: 500
    max_gap_seconds: 4500
    completion_grace_seconds: 300
  system_services:
    status_path: /data/systemd-status.json
    collector_max_age_seconds: 60
    reload_timeout_seconds: 900
    rpc_failure_threshold: 3

thresholds:
  disk_warning_percent: 80
  disk_critical_percent: 90
  memory_warning_percent: 85
  memory_critical_percent: 95
  cpu_warning_percent: 90
  cpu_sustain_checks: 3

cooldowns:
  default_seconds: 900
  critical_seconds: 300

docker:
  enabled: true
  log_tail_lines: 100
  log_monitoring:
    # Container-only mode: application log lines do not create incidents.
    enabled: false
    # These match new log lines even when the container remains RUNNING.
    error_patterns:
      - "\\btraceback\\b"
      - "\\b(fatal|critical|panic|exception)\\b"
      - "\\b(unhandled|uncaught)\\b"
      - "\\b(error|err)\\b"
      - "connection refused"
      - "connection reset"
      - "timeout"
      - "timed out"
      - "database.*(failed|error|refused|unavailable)"
      - "rpc.*(failed|error|timeout)"
      - "promise rejection"
      - "out of memory"
      - "oom killed"
    ignore_patterns:
      - "retrying request"
      - "temporary websocket disconnect"
      - "rate limit retry"
      # Expected provider fallback/reconnect noise across all bots.
      - "402 Payment Required"
      - "You have used all your credits"
      - "account is expired"
      - "Retrying this range next tick"
      - "WS reconnecting"
      - "WebSocket reconnecting"
      - "WebSocket reconnected successfully"
      - "WebSocket appears stalled"
      - "Trying fallback WebSocket endpoint"
      - "WebSocket subscription/endpoint issue"
      - "received result for unknown id"
      - "Subscription timed out"
      - "WebSocket decoded:"
      - "WebSocket matched:"
      - "HTTP backfill scanned:"
      - "HTTP backfill matched:"
      - "Alerts delivered:"
      - "ETH USDT Monitor Health"
      - "Ethereum USDC WebSocket decoded:"
      - "BNB Smart Chain USDT WebSocket decoded:"
  containers:
    - name: beenco-connect-portal-1
      project: beenco-connect
      critical: true
    - name: beenco-connect-postgres-1
      project: beenco-connect
      critical: true
    - name: beenco-connect-redis-1
      project: beenco-connect
      critical: true
    - name: beencomindshub--web-1
      project: beencomindshub
      critical: true
    - name: beencomindshub--api-1
      project: beencomindshub
      critical: true
    - name: beencomindshub--model-gateway-1
      project: beencomindshub
      critical: true
    - name: zig-whale-bot
      project: zig-whale-bot
      critical: true
    - name: zig-usd-only-alerts-zig-only-alerts-1
      project: zig-usd-only-alerts
      critical: true
    - name: highbuy-monitor
      project: highbuy-monitor
      critical: true
    - name: zigchain-wallet-monitor
      project: zigchain-wallet-monitor
      critical: true
    - name: liquidityprovider-frontend
      project: liquidityprovider
      critical: true
    - name: volumebot-pair-1
      project: volumebot
      critical: true
    - name: volumebot-pair-2
      project: volumebot
      critical: true
    - name: volumebot-pair-3
      project: volumebot
      critical: true
    - name: volumebot-pair-4
      project: volumebot
      critical: true
    - name: volumebot-pair-5
      project: volumebot
      critical: true
    - name: volumebot-pair-6
      project: volumebot
      critical: true
    - name: volumebot-pair-7
      project: volumebot
      critical: true
    - name: volumebot-db
      project: volumebot
      critical: true
    - name: vault-automater-worker-1
      project: vault-automater
      critical: true
    - name: vault-automater-web-1
      project: vault-automater
      critical: true
    - name: vault-automater-api-1
      project: vault-automater
      critical: true
    - name: ethzigiquid-web-1
      project: ethzigiquid
      critical: true
    - name: ethzigiquid-api-1
      project: ethzigiquid
      critical: true
    - name: ethzigiquid-postgres-1
      project: ethzigiquid
      critical: true
    - name: bsc-and-eth-token-monitor
      project: bsc-and-eth-token-monitor
      critical: true
      ignore_log_patterns:
        - "402 Payment Required"
        - "You have used all your credits"
        - "account is expired"
        - "Retrying this range next tick"
        - "WebSocket decoded 0 events while HTTP backfill advanced"
        - "WebSocket appears stalled"
        - "WebSocket reconnected successfully"
        - "Last WS block:"
        - "Last HTTP block:"
    - name: tokenx-vault-postgres
      project: tokenx-vault
      critical: true
    - name: zigchain-detector-bot-1
      project: zigchain-detector
      critical: true
    - name: zigchain-detector-db-1
      project: zigchain-detector
      critical: true
    - name: fracks-backend
      project: fracks
      critical: true
    - name: arkive
      project: arkive
      critical: true
    - name: arkive-postgres
      project: arkive
      critical: true
    - name: fracks-db
      project: fracks
      critical: true
    - name: zig_frontend
      project: zig
      critical: true
    - name: zig_backend
      project: zig
      critical: true
    - name: zig_bot
      project: zig
      critical: true
    - name: zig_postgres
      project: zig
      critical: true
    - name: bep20-usdt-telegram-monitor
      project: bep20-usdt
      critical: true
      ignore_log_patterns:
        - "402 Payment Required"
        - "You have used all your credits"
        - "account is expired"
        - "Retrying this range next tick"
        - "WebSocket decoded 0 events while HTTP backfill advanced"
        - "WebSocket appears stalled"
        - "WebSocket reconnected successfully"
        - "Last WS block:"
        - "Last HTTP block:"
    - name: eth-usdt-telegram-monitor
      project: eth-usdt
      critical: true
      ignore_log_patterns:
        - "WebSocket decoded 0 events while HTTP backfill advanced"
        - "WebSocket appears stalled"
        - "WebSocket reconnected successfully"
        - "Last WS block:"
        - "Last HTTP block:"
    - name: sheets-sync
      project: sheets-sync
      critical: true
    - name: zigchain-bot
      project: patronicluster
      critical: true
    - name: zigchain-monitor
      project: stakeunstake
      critical: true
      ignore_log_patterns:
        - "eth-rpc.*failed over to"
    - name: mdf-tracker
      project: launches
      critical: true
    - name: wallet-monitor
      project: wallet-monitor
      critical: true

projects:
  frontend:
    title: Frontend
    icon: 🖥️
    items:
      - id: beencointernalcomms
        name: Beencointernalcomms
        menu_name: Beencoin Internal
        containers:
          - beenco-connect-portal-1
          - beenco-connect-postgres-1
          - beenco-connect-redis-1
      - id: beencomindshub
        name: Beencomindshub
        menu_name: Beencomindshub
        containers:
          - beencomindshub--web-1
          - beencomindshub--api-1
          - beencomindshub--model-gateway-1
      - id: liquidity-provider
        name: Liquidity Provider
        menu_name: Liquidity Provider
        containers:
          - liquidityprovider-frontend
          - volumebot-pair-3
          - volumebot-pair-2
          - volumebot-pair-5
          - volumebot-pair-6
          - volumebot-pair-7
          - volumebot-pair-4
          - volumebot-pair-1
          - volumebot-db
      - id: vault-automator
        name: VaultAutomator
        menu_name: VaultAutomator
        containers:
          - vault-automater-worker-1
          - vault-automater-web-1
          - vault-automater-api-1
      - id: ethzigliquid
        name: EthZigLiquid
        menu_name: EthZigLiquid
        containers:
          - ethzigiquid-web-1
          - ethzigiquid-api-1
          - ethzigiquid-postgres-1
      - id: arkive
        name: Arkive
        menu_name: Arkive
        containers:
          - arkive
          - arkive-postgres
      - id: zigexchange
        name: ZigExchange
        menu_name: ZigExchange
        containers:
          - zig_frontend
          - zig_backend
          - zig_bot
          - zig_postgres
  bots_docker:
    title: Bots (Docker)
    icon: 🐳
    items:
      - id: marketzig
        name: Zig Whale Bot
        menu_name: Zig Whale Bot
        compose_project: marketzig
        working_dir: /root/saad/MarketZig
        compose_file: /root/saad/MarketZig/docker-compose.yml
        containers:
          - zig-whale-bot
      - id: zig-usd-only-alerts
        name: Zig USD Only Alerts
        menu_name: Zig USD Alerts
        compose_project: zig-usd-only-alerts
        working_dir: /root/saad/zig-usd-only-alerts
        compose_file: /root/saad/zig-usd-only-alerts/docker-compose.yml
        containers:
          - zig-usd-only-alerts-zig-only-alerts-1
      - id: wallet-monitor
        name: Wallet Monitor
        menu_name: Wallet Monitor
        compose_project: wallet-monitor
        working_dir: /root/saad/wallet-monitor
        compose_file: /root/saad/wallet-monitor/docker-compose.yml
        containers:
          - wallet-monitor
      - id: patronicluster
        name: Zigchain Bot
        menu_name: Zigchain Bot
        compose_project: patronicluster
        working_dir: /root/saad/patroni_monitoring/PatroniCluster
        compose_file: /root/saad/patroni_monitoring/PatroniCluster/docker-compose.yml
        containers:
          - zigchain-bot
      - id: stakeunstake
        name: Stake Unstake
        menu_name: Stake Unstake
        compose_project: stakeunstake
        working_dir: /root/saad/StakeUnstake
        compose_file: /root/saad/StakeUnstake/docker-compose.yml
        containers:
          - zigchain-monitor
      - id: launches
        name: MDF Tracker
        menu_name: MDF Tracker
        compose_project: launches
        working_dir: /root/saad/Launches
        compose_file: /root/saad/Launches/docker-compose.yml
        containers:
          - mdf-tracker
      - id: highlaunches
        name: HighBuy Monitor
        menu_name: HighBuy Monitor
        compose_project: highlaunches
        working_dir: /root/saad/HighLaunches
        compose_file: /root/saad/HighLaunches/docker-compose.yml
        containers:
          - highbuy-monitor
      - id: nawavaldora
        name: Nawa Valdora
        menu_name: Nawa Valdora
        compose_project: nawavaldora
        working_dir: /root/saad/NawaValdora
        compose_file: /root/saad/NawaValdora/docker-compose.yml
        containers:
          - zigchain-wallet-monitor
      - id: tokenx-vault
        name: TokenX Vault Monitors
        menu_name: TokenX Vault
        compose_project: tokenx-vault
        working_dir: /root/saad/TokenX-Vault
        compose_file: /root/saad/TokenX-Vault/docker-compose.yml
        containers:
          - bsc-and-eth-token-monitor
          - tokenx-vault-postgres
      - id: bep20
        name: BEP20 USDT Telegram Monitor
        menu_name: BEP20 USDT
        compose_project: bep20
        working_dir: /root/saad/bep20
        compose_file: /root/saad/bep20/docker-compose.yml
        containers:
          - bep20-usdt-telegram-monitor
      - id: ethtethertoken
        name: ETH USDT Telegram Monitor
        menu_name: ETH USDT
        compose_project: ethtethertoken
        working_dir: /root/saad/EthTethertoken
        compose_file: /root/saad/EthTethertoken/docker-compose.yml
        containers:
          - eth-usdt-telegram-monitor
      - id: sheetszahoor
        name: Sheets Sync
        menu_name: Sheets Sync
        compose_project: sheetszahoor
        working_dir: /root/saad/sheetszahoor
        compose_file: /root/saad/sheetszahoor/docker-compose.yml
        containers:
          - sheets-sync
  bots_systemd:
    title: System Services
    icon: ⚙️
    items:
      - id: system-services
        name: System Services
        services:
          - name: wallet-watchman
            menu_name: Wallet Watchman
            unit: wallet-watchman.service
          - name: zigchain-exporter
            menu_name: Zigchain Exporter
            unit: zigchain-exporter.service

systemd:
  # Status is supplied by the safe host-side collector.
  enabled: true
  collector_max_age_seconds: 60
  services:
    - name: wallet-watchman
      project: wallet-monitor
      unit: wallet-watchman.service
      critical: true
      reload_timeout_seconds: 900
      rpc_failure_threshold: 3
    - name: zigchain-exporter
      project: zigchain-exporter
      unit: zigchain-exporter.service
      critical: true

heartbeats: []

telegram:
  enabled: true
  # Values should normally come from environment variables.
  bot_token_env: TELEGRAM_BOT_TOKEN
  # Comma-separated IDs for multiple users, groups, or channels.
  chat_ids_env: TELEGRAM_CHAT_IDS
  # Legacy single-chat fallback:
  chat_id_env: TELEGRAM_CHAT_ID
