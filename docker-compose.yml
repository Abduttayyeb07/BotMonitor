services:
  central-monitor:
    build: .
    container_name: central-monitor
    restart: unless-stopped
    init: true
    user: "0:0"
    env_file:
      - .env
    environment:
      MONITOR_CONFIG: /app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Read-only: lets /usage measure each bot's Docker log file size.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
