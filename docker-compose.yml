services:
  central-monitor:
    build: .
    container_name: central-monitor
    restart: unless-stopped
    init: true
    user: "0:0"
    env_file:
      - .env
    environment:
      MONITOR_CONFIG: /app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true

networks:
  default:
    name: botmonitor_monitoring
    driver: bridge
    ipam:
      config:
        # Use a private subnet dedicated to this monitoring service.
        # Change it if it overlaps with an existing Docker/VPN/server network.
        - subnet: 172.31.250.0/24
